[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "notify_kit"
version = "0.1.0"
description = "Reusable push notifications (APNs today) for small self-hosted apps — Python server half + Swift client half."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
# APNs needs ES256 signing + HTTP/2. Kept optional so the core imports anywhere.
apns = ["cryptography>=41", "h2>=4"]
test = ["pytest>=8", "pytest-asyncio>=0.23", "cryptography>=41", "h2>=4"]

[tool.setuptools]
packages = ["notify_kit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
